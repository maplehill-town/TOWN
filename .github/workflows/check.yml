name: town check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: check the proposal
        run: |
          # only the files the proposal touches; rules, schemas and this check can never change through a proposal
          export CHANGED="$(git diff --name-only origin/main...HEAD)"
          node scripts/check.mjs
